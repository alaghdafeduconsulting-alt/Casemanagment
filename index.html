<title>فضاء آفاق</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: navy app bar with section nav; one working column; child file = header card + tabs; every form opens in a full-height sheet */
:root{
  --navy:#1E3A5F; --navy-ink:#FFFFFF; --navy-soft:#E3EAF3; --orange:#E08E45; --orange-ink:#FFFFFF; --orange-soft:#FBEBDC;
  --bg:#EEF2F7; --card:#FFFFFF; --sunk:#E6ECF3; --line:#D5DDE8; --text:#16283D; --muted:#5A6B80;
  --ok:#2E7D5B; --ok-soft:#DFF1E8; --warn:#A8661C; --warn-soft:#FBEEDB; --crit:#B3413A; --crit-soft:#F8E3E1;
  --bar:#1E3A5F; --bar-ink:#FFFFFF; --bar-muted:#C3D1E2;
  --f-display:"Tajawal","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Tajawal",Tahoma,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --navy:#8FB4E0; --navy-ink:#0F1A27; --navy-soft:#1B2B40; --orange:#F0A566; --orange-ink:#1A1208; --orange-soft:#3A2A1C;
  --bg:#0F1A27; --card:#172536; --sunk:#1D2D41; --line:#2B3D53; --text:#E6EDF5; --muted:#9BACC0;
  --ok:#6FCB9F; --ok-soft:#173327; --warn:#E9B068; --warn-soft:#35270F; --crit:#F08A82; --crit-soft:#3A1F1E;
  --bar:#13263D; --bar-ink:#E6EDF5; --bar-muted:#9BACC0; color-scheme:dark}}
:root[data-theme="dark"]{
  --navy:#8FB4E0; --navy-ink:#0F1A27; --navy-soft:#1B2B40; --orange:#F0A566; --orange-ink:#1A1208; --orange-soft:#3A2A1C;
  --bg:#0F1A27; --card:#172536; --sunk:#1D2D41; --line:#2B3D53; --text:#E6EDF5; --muted:#9BACC0;
  --ok:#6FCB9F; --ok-soft:#173327; --warn:#E9B068; --warn-soft:#35270F; --crit:#F08A82; --crit-soft:#3A1F1E;
  --bar:#13263D; --bar-ink:#E6EDF5; --bar-muted:#9BACC0; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:800;margin:0;line-height:1.3;text-wrap:balance}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--bar-ink)}
.bar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto;background:none;border:0;color:inherit;cursor:pointer;padding:0;text-align:start;text-decoration:none}
.mark{width:36px;height:36px;border-radius:10px;background:var(--orange);color:var(--orange-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:20px}
.brand b{font-family:var(--f-display);font-size:18px;display:block;line-height:1.1}
.brand small{color:var(--bar-muted);font-size:12.5px}
nav.sec{display:flex;gap:2px;overflow-x:auto;max-width:100%}
nav.sec a{color:var(--bar-muted);text-decoration:none;padding:7px 12px;border-radius:9px;font-weight:600;font-size:14.5px;white-space:nowrap}
nav.sec a[aria-current="page"]{background:rgb(255 255 255/.14);color:var(--bar-ink)}
nav.sec a:hover{color:var(--bar-ink)}
main{padding-block:20px 80px}
.banner{display:flex;gap:10px;padding:10px 14px;border-radius:var(--r);background:var(--orange-soft);font-size:14px;margin-bottom:16px}
.banner b{color:var(--orange)}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;margin-bottom:16px}
.head h1{font-size:clamp(22px,4vw,28px);margin-inline-end:auto}
.eyebrow{font-size:13px;color:var(--muted);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--line);background:var(--card);padding:9px 15px;border-radius:10px;cursor:pointer;font-weight:700;font-size:15px;color:var(--text);text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--orange);border-color:var(--orange);color:var(--orange-ink)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.danger{color:var(--crit);border-color:var(--crit-soft)}
.btn.sm{padding:5px 11px;font-size:13.5px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:18px}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat .n{font-family:var(--f-display);font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .l{color:var(--muted);font-size:13.5px}
.stat.crit .n{color:var(--crit)} .stat.warn .n{color:var(--warn)}
.grid2{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel>h2{font-size:17px;margin-bottom:10px}
.stack{display:flex;flex-direction:column;gap:12px}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:700}
.sub{color:var(--muted);font-size:13.5px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:99px;font-size:12.5px;font-weight:600;background:var(--sunk);color:var(--text);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.crit{background:var(--crit-soft);color:var(--crit)}.chip.acc{background:var(--navy-soft);color:var(--navy)}.chip.or{background:var(--orange-soft);color:var(--orange)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.roster{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:grid;grid-template-columns:minmax(150px,1.3fr) minmax(0,1fr) minmax(0,1fr) minmax(0,.8fr) minmax(140px,1.4fr);gap:12px;align-items:center;padding:12px 16px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:start;cursor:pointer;color:inherit}
.row:first-child{border-top:0}
.row:hover{background:var(--sunk)}
.row.th{cursor:default;background:var(--sunk);font-size:12.5px;color:var(--muted);font-weight:700}
@media (max-width:760px){.row{grid-template-columns:1fr 1fr}.row.th{display:none}.row .c-al{grid-column:1/-1}}
.code{font-family:var(--f-display);font-weight:800;font-variant-numeric:tabular-nums}
.meter{height:6px;background:var(--sunk);border-radius:9px;overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;background:var(--navy);border-radius:9px}
.empty{padding:34px 18px;text-align:center;color:var(--muted)}
.empty h3{color:var(--text);margin-bottom:6px;font-size:18px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tools input,.tools select{width:auto;flex:1;min-width:160px}
.childhead{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-start}
.childhead .id{margin-inline-end:auto;min-width:0}
.childhead h1{font-size:24px}
.kv{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:14px;margin-top:6px}
.kv span{color:var(--muted)}
.addbar{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:14px}
.addbar button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;text-align:start}
.addbar button:hover{border-color:var(--orange)}
.addbar b{font-size:14.5px}
.addbar small{color:var(--muted);font-size:12px;line-height:1.4}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:700;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--orange)}
.count{font-size:11.5px;background:var(--sunk);border-radius:99px;padding:1px 7px;margin-inline-start:4px}
.goal{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px}
.seg button{border:1.5px solid var(--line);background:var(--card);border-radius:9px;padding:6px 12px;font-size:14px;font-weight:700;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.seg button.on.g-done{background:#2E7D5B;border-color:#2E7D5B;color:#fff}
.seg button:disabled{cursor:default}
.trend{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:560px){.trend{grid-template-columns:repeat(2,minmax(0,1fr))}}
.spark{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.spark .t{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:4px}
.spark .t b{color:var(--text);font-variant-numeric:tabular-nums}
.spark svg{width:100%;height:38px;display:block;margin-top:4px}
.tl{display:flex;flex-direction:column;gap:8px}
.tli{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer;text-align:start;width:100%;color:inherit}
.tli:hover{border-color:var(--navy)}
.tag{font-size:12px;font-weight:800;padding:3px 9px;border-radius:7px;white-space:nowrap}
.ty-obs{background:var(--navy-soft);color:var(--navy)}.ty-acad{background:var(--orange-soft);color:var(--orange)}.ty-ready{background:var(--ok-soft);color:var(--ok)}.ty-fb{background:var(--sunk);color:var(--text)}.ty-screen{background:var(--warn-soft);color:var(--warn)}.ty-note{background:var(--sunk);color:var(--muted)}
.alert{background:var(--crit-soft);border-inline-start:5px solid var(--crit);padding:10px 14px;border-radius:10px;font-size:14.5px}
.tip{background:var(--orange-soft);border-radius:10px;padding:10px 14px;font-size:14px}
ul.plain{margin:6px 0 0;padding-inline-start:20px}
ul.plain li{margin-bottom:4px}
.dom{padding:10px 0;border-top:1px solid var(--line)}
.dom:first-child{border-top:0}
.domh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:800}
.bigm{height:10px;background:var(--sunk);border-radius:6px;margin:6px 0 2px;overflow:hidden}
.bigm i{display:block;height:100%;border-radius:6px}
.up{color:var(--ok);font-weight:800}.down{color:var(--crit);font-weight:800}
.stackbar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--sunk);margin:8px 0 6px}
.stackbar i{display:block;height:100%}
.lgrow{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted)}
.lgrow i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:4px;vertical-align:middle}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.lib a{display:flex;flex-direction:column;gap:4px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);text-decoration:none;color:inherit}
.lib a:hover{border-color:var(--orange)}
.lib b{font-family:var(--f-display);font-size:16px}
/* sheet */
.sheetwrap{position:fixed;inset:0;z-index:20;background:rgb(8 16 28/.55);display:flex;justify-content:center;align-items:stretch}
.sheet{background:var(--bg);width:100%;max-width:760px;display:flex;flex-direction:column;min-height:0;box-shadow:0 0 40px rgb(0 0 0/.25)}
.sh-top{background:var(--card);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px}
.sh-top h2{font-size:18px;margin-inline-end:auto}
.sh-body{flex:1;overflow-y:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sh-foot{background:var(--card);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;gap:8px;flex-wrap:wrap}
.sh-foot .btn{flex:1;min-width:120px}
.fs{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.fs>h3{font-size:17px}
.fs .lead{color:var(--muted);font-size:14px;margin:-4px 0 0}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:700;font-size:14.5px}
.fl{font-weight:700;font-size:14.5px}
input[type=text],input[type=date],input[type=number],input[type=month],input[type=search],select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);font-size:16px;color:var(--text)}
textarea{min-height:68px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.item.done{border-color:var(--navy)}
.q{font-weight:700}
.q .num{display:inline-block;min-width:24px;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:6px}
@media (max-width:520px){.opts.many{grid-template-columns:repeat(4,minmax(0,1fr))}}
.opts button{padding:9px 4px;border-radius:9px;border:2px solid var(--line);background:transparent;font-weight:700;font-size:14px;cursor:pointer;line-height:1.25;color:var(--text)}
.opts button.on{background:var(--c,var(--navy));border-color:var(--c,var(--navy));color:#fff}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:15px}
.chk input{width:20px;height:20px;flex:none;margin-top:3px;accent-color:var(--navy)}
.chk:has(input:checked){border-color:var(--navy);background:var(--navy-soft)}
.chk.red input{accent-color:var(--crit)}
.chk.red:has(input:checked){border-color:var(--crit);background:var(--crit-soft)}
.add{width:100%;padding:10px;border:2px dashed var(--line);border-radius:10px;background:none;font-weight:700;cursor:pointer;color:var(--navy)}
.beh{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.docout{white-space:pre-wrap;font-size:14.5px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.toast{position:fixed;inset-inline:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:40}
.toast div{background:var(--text);color:var(--bg);padding:9px 18px;border-radius:20px;font-size:14.5px;max-width:90vw}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.btn,.row,.tli,.addbar button{transition:background .15s,border-color .15s}}
</style>

<div id="root" dir="rtl" lang="ar">
<header class="bar"><div class="wrap" id="bar"></div></header>
<main class="wrap" id="app"><div class="loading">جار التحميل…</div></main>
<div id="sheet"></div>
<div class="toast" id="toast" hidden><div id="toastText"></div></div>
</div>

<script>
/* ================= reference data (from the association's forms) ================= */
const GROUPS=["قسم التربية الخاصة","برنامج مواكبة (الإدماج المدرسي)","التعليم الأولي","متابعة خارجية"];
const STATUSES=["نشط","مدمج في مدرسة","في الانتظار","متوقف"];
const DISABILITY=["شلل دماغي","إعاقة حركية","توحد","متلازمة داون","إعاقة ذهنية","متعددة","فرط الحركة وتشتت الانتباه","صعوبات التعلم","غير مذكورة في الملف"];
const OBS=[
 {id:"comm",title:"التواصل والفهم",who:"أخصائي تقويم النطق",items:["ينتبه عندما نناديه باسمه","يفهم تعليمة بسيطة واحدة (مثال: «أعطني الكرة»)","يعبّر عن حاجته بأي طريقة (كلمة، إشارة، نظرة، صورة)","يقول «نعم» أو «لا» بأي طريقة","يشير إلى شيء مألوف أو يسمّيه عندما نسأله عنه","يقلّد صوتاً أو كلمة بعدنا"]},
 {id:"social",title:"العلاقة مع الآخرين والمشاعر",who:"الأخصائي النفسي",items:["ينظر إلى الشخص الذي يكلّمه","يبتسم أو يفرح عند اللعب مع الآخرين","يلعب بجانب طفل آخر أو معه","ينتظر دوره (بمساعدة إن لزم)","يهدأ خلال بضع دقائق عندما ينزعج","يقبل تغيير النشاط دون نوبة غضب"]},
 {id:"attention",title:"الانتباه والعمل داخل القسم",who:"الأخصائي النفسي",items:["يبقى في نشاط واحد 5 دقائق","يبقى في مكانه أثناء النشاط (بالوضعية المناسبة له)","ينتقل من نشاط إلى آخر بهدوء","يتبع روتين القسم (الدخول، الأكل، الخروج)","يُكمل النشاط حتى النهاية","يستطيع العمل مع ضجيج خفيف حوله"]},
 {id:"motor",title:"الحركة",who:"الترويض الطبي والنفس حركي",items:["يجلس بثبات (وحده أو بالسند الخاص به)","يتنقل داخل القسم بطريقته (مشياً، زحفاً، بالكرسي)","يمسك شيئاً بيده ويتركه متى أراد","يستعمل يديه معاً (يمسك الورقة بيد ويخطّ بالأخرى)","يمسك القلم أو الطباشير ويخطّ خطاً","يقلّد حركة بسيطة (رفع اليدين، التصفيق)"]},

function domainScore(r,d){
  const a=(r.ans&&r.ans[d.id])||[];let sum=0,n=0,answered=0;
  a.forEach(v=>{if(v==null)return;answered++;if(v==="na")return;sum+=ANS[v];n++});
  const pct=n?Math.round(sum/(2*n)*100):null;const enough=answered>=Math.ceil(d.items.length/2)&&n>0;
  let level="none",label="بيانات غير كافية";
  if(enough){if(pct>=75){level="good";label="جيد"}else if(pct>=50){level="mid";label="في تقدّم"}else{level="low";label="يحتاج دعمًا"}}
  return {pct,level,label,answered,total:d.items.length};
}
function obsAnalysis(r){
  const doms=OBS.map(d=>({d,s:domainScore(r,d)}));const refer=new Map();
  const add=(w,why)=>{if(!refer.has(w))refer.set(w,[]);refer.get(w).push(why)};
  doms.forEach(({d,s})=>{if(s.level==="low")add(d.who,d.title)});
  const sens=(r.sensory||[]).length;if(sens>=2)add("الأخصائي النفسي والنفس حركي","ملاحظات حسية ("+sens+")");
  if((r.behaviors||[]).some(b=>b.what&&b.freq&&b.freq!==FREQ[0]))add("الأخصائي النفسي","سلوك متكرر");
  const unanswered=OBS.reduce((n,d)=>n+d.items.filter((_,i)=>((r.ans||{})[d.id]||[])[i]==null).length,0);
  return {doms,refer,flags:r.flags||[],unanswered};
}

function readyAnalysis(r){
  let sum=0,n=0;const critMiss=[],goals=[],dom=[];
  READY.forEach(d=>{let s=0,m=0;d.items.forEach((it,i)=>{const v=((r.ans||{})[d.id]||[])[i];if(!v)return;s+=RV[v];m++;sum+=RV[v];n++;
    if(v!==RL[0])goals.push({t:it.t,c:!!it.c,v});if(it.c&&v===RL[2])critMiss.push(it.t)});
    dom.push({d,pct:m?Math.round(s/(2*m)*100):null})});
  const total=READY.reduce((k,d)=>k+d.items.length,0);const pct=n?Math.round(sum/(2*n)*100):null;
  let dec,cls;
  if(n<total*.8){dec="أكمل الأسئلة أولًا";cls="none"}
  else if(critMiss.length||pct<50){dec="يحتاج مزيدًا من التحضير قبل الإدماج";cls="low"}
  else if(pct>=75){dec="مستعد للإدماج مع متابعة عادية عبر برنامج مواكبة";cls="good"}
  else{dec="مستعد للإدماج مع مرافقة ودعم داخل المدرسة";cls="mid"}
  goals.sort((a,b)=>(b.c-a.c)||(a.v===RL[2]?-1:1));
  const gaps=SCHOOL.filter((_,i)=>((r.ans||{}).cond||[])[i]===CL[1]);
  return {pct,dec,cls,critMiss,goals,gaps,dom};
}
function screenAnalysis(r){

  const sig=per.filter(p=>p.signal).length,anyTwo=per.reduce((n,p)=>n+p.twos.length,0);const urgent=r.urgent||[];

function spark(vals){

  <polygon points="${x(0)},${h-pad} ${pts} ${x(vals.length-1)},${h-pad}" fill="var(--navy-soft)"/><polyline points="${pts}" fill="none" stroke="var(--navy)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>

   ${c.notes?`<div class="panel"><h2>ملاحظات عامة</h2><p style="margin:0;white-space:pre-wrap">${esc(c.notes)}</p></div>`:""}

function recHint(r){
  if(r.type==="obs"){const A=obsAnalysis(r);return (r.kind==="first"?"ملاحظة أولى":"متابعة شهرية")+(A.flags.length?" · علامات مهمة":"")+(A.refer.size?" · إحالة: "+[...A.refer.keys()].join("، "):"")}
  if(r.type==="acad")return ACAD.filter(s=>(r.subjects||[]).includes(s.id)).map(s=>s.title+": "+subjStats(r,s).k+"/"+subjStats(r,s).total).join(" · ");
  if(r.type==="ready")return readyAnalysis(r).dec;
  if(r.type==="fb")return (r.specialist||"")+(r.review?" · مراجعة "+fd(r.review):"");
  if(r.type==="screen")return screenAnalysis(r).dec;
  return (r.kind||"")+(r.text?" · "+r.text.slice(0,60):"");
}
function tli(r){return `<button class="tli" data-act="openRec" data-id="${esc(r.id)}"><span class="tag ty-${r.type}">${esc(TYPES[r.type].t)}</span><span style="min-width:0"><b>${fdh(r.date)}</b> <span class="sub">· ${esc(whoR(r))}</span><span class="sub" style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(recHint(r))}</span></span><span class="sub">←</span></button>`}
function tabTimeline(recs){return recs.length?`<div class="tl">${recs.map(tli).join("")}</div>`:`<div class="roster"><div class="empty"><h3>السجل فارغ</h3><p>كل ملاحظة أو تقييم أو رد أخصائي يُسجَّل هنا بالتاريخ واسم من سجّله.</p></div></div>`}

    <div class="chips">${armed?`<button class="btn sm" data-act="disarm">إلغاء</button><button class="btn sm danger" data-act="delGoal" data-id="${esc(g.id)}">تأكيد الحذف</button>`:`<button class="btn sm ghost" data-act="arm" data-v="goal:${esc(g.id)}">حذف</button>`}</div></div>`}).join("")}</div>`:`<p class="sub" style="margin:0">لا أهداف بعد. ابدأ بـ 3 إلى 5 أهداف قابلة للملاحظة، قررها الفريق في الاجتماع الشهري.</p>`}</div>

   ${suggestGoals(c).length?`<div><div class="sub" style="margin-bottom:5px">اقتراحات من آخر التقييمات</div><div class="chips">${suggestGoals(c).map((s,i)=>`<button type="button" class="chip" style="cursor:pointer;border:1px dashed var(--line)" data-act="sugg" data-t="${esc(s.t)}" data-d="${esc(s.d)}">${esc(s.t)}</button>`).join("")}</div></div>`:""}
   <label class="f">الهدف (قابل للملاحظة)<textarea id="g-text" required placeholder="مثال: يطلب الماء بالإشارة دون مساعدة"></textarea></label>
   <div class="two"><label class="f">المجال<select id="g-dom">${GDOM.map(d=>`<option>${d}</option>`).join("")}</select></label><label class="f">المراجعة<input type="date" id="g-rev"></label></div>

   <button class="btn pri" type="submit">إضافة الهدف</button></form></div>`;
}
function suggestGoals(c){
  const out=[],have=new Set(goalsOf(c.id).map(g=>g.text));
  const ac=recsOf(c.id,"acad")[0];if(ac)ACAD.filter(s=>(ac.subjects||[]).includes(s.id)).forEach(s=>subjStats(ac,s).next.slice(0,2).forEach(x=>out.push({t:x.t,d:"التعلّمات"})));
  const rd=recsOf(c.id,"ready")[0];if(rd)readyAnalysis(rd).goals.slice(0,2).forEach(g=>out.push({t:g.t,d:"الإدماج المدرسي"}));
  const ob=recsOf(c.id,"obs")[0];if(ob)OBS.forEach(d=>{const a=(ob.ans||{})[d.id]||[];const i=a.findIndex(v=>v==="no");if(i>=0&&out.length<8)out.push({t:d.items[i],d:{comm:"التواصل",social:"السلوك والمشاعر",attention:"الانتباه",motor:"الحركة",autonomy:"الاستقلالية",learning:"التعلّمات"}[d.id]})});
  return out.filter(x=>!have.has(x.t)).slice(0,6);
}

/* ---------- monthly meeting ---------- */
function meetingData(ym){
  const obs=S.records.filter(r=>r.type==="obs"&&(r.date||"").startsWith(ym));
  const refer=new Map(),flags=[];
  obs.forEach(r=>{const A=obsAnalysis(r);A.refer.forEach((why,w)=>{if(!refer.has(w))refer.set(w,[]);refer.get(w).push({r,why})});if(A.flags.length)flags.push({r,f:A.flags})});
  const seen=new Set(obs.map(r=>r.childId));const missing=S.children.filter(c=>(c.status||"نشط")==="نشط"&&!seen.has(c.id));
  const fbs=S.records.filter(r=>r.type==="fb"&&(r.date||"").startsWith(ym));
  const screens=S.records.filter(r=>r.type==="screen"&&(r.date||"").startsWith(ym)).filter(r=>["crit","warn"].includes(screenAnalysis(r).cls));
  const goalsDone=S.goals.filter(g=>g.status==="تحقّق").length;
  return {obs,refer,flags,missing,fbs,screens,goalsDone};
}

  const ym=view.month,M=meetingData(ym),L=[];
  L.push("جدول أعمال الاجتماع الشهري — جمعية آفاق، مركز خطوات — "+monthName(ym));L.push("========================================");
  L.push("عدد الملاحظات المسجلة: "+M.obs.length);
  if(M.flags.length){L.push("\n▪ العلامات المهمة");M.flags.forEach(({r,f})=>L.push("  - "+childLabel(childById(r.childId))+": "+f.join("؛ ")))}
  L.push("\n▪ الإحالات حسب الأخصائي");if(!M.refer.size)L.push("  لا إحالات.");
  M.refer.forEach((list,w)=>{L.push("  "+w+":");list.forEach(({r,why})=>L.push("     - "+childLabel(childById(r.childId))+" ("+why.join("، ")+")"))});
  if(M.screens.length){L.push("\n▪ رصد المدارس");M.screens.forEach(r=>L.push("  - "+childLabel(childById(r.childId))+": "+screenAnalysis(r).dec))}
  if(M.missing.length){L.push("\n▪ أطفال بدون ملاحظة هذا الشهر");M.missing.forEach(c=>L.push("  - "+childLabel(c)+(c.educator?" ("+c.educator+")":"")))}
  L.push("\n▪ أهداف المشروع الفردي المحققة إلى الآن: "+M.goalsDone);
  return L.join("\n");
}

/* ================= sheet (forms + record view) ================= */
function openForm(kind,opts){
  // kind: record type key | "child" | "act"
  const o=opts||{};let spec,col,r;
  if(kind==="child"){spec=CHILD_FORM;col="children";r=o.r?clone(o.r):{id:uid(),status:"نشط",group:GROUPS[0],createdAt:Date.now()}}
  else if(kind==="act"){spec=ACT_FORM;col="activities";r=o.r?clone(o.r):{id:uid(),type:ACT_TYPES[0],date:today(),createdAt:Date.now()}}
  else{spec=TYPES[kind];col="records";r=o.r?clone(o.r):{id:uid(),type:kind,childId:o.child||"",date:today(),...spec.blank(),createdAt:Date.now()};
    if(!o.r&&kind==="obs"){const c=childById(o.child);if(c&&c.educator)r.educator=c.educator;if(!recsOf(o.child,"obs").length)r.kind="first"}
    if(o.spec)r.specialist=SPECIALISTS.find(s=>o.spec.includes(s.replace("الأخصائي ","")))||"";if(o.reason)r.reason=o.reason}
  F={kind,spec,col,r,mode:"edit",isNew:!o.r,armed:false};renderSheet(true);
}
function openRecord(id){const r=S.records.find(x=>x.id===id);if(!r)return;F={kind:r.type,spec:TYPES[r.type],col:"records",r:clone(r),mode:"view",isNew:false,armed:false};renderSheet(true)}
function closeSheet(){F=null;$("sheet").innerHTML="";document.body.style.overflow=""}
function fieldHtml(f){
  if(f.row)return `<div class="two">${f.row.map(fieldHtml).join("")}</div>`;
  const r=F.r,v=f.k?getP(r,f.k):null,id="f-"+(f.k||"").replace(/\./g,"_");
  switch(f.type){
   case "tip":return `<div class="tip">${f.html}</div>`;
   case "alert":return `<div class="alert">${f.html}</div>`;
   case "text":case "date":case "number":return `<label class="f">${esc(f.l)}<input type="${f.type}" id="${id}" data-bind="${f.k}" value="${esc(v??"")}" ${f.ph?`placeholder="${esc(f.ph)}"`:""}></label>`;
   case "textarea":return `<label class="f">${esc(f.l)}<textarea id="${id}" data-bind="${f.k}" ${f.ph?`placeholder="${esc(f.ph)}"`:""}>${esc(v??"")}</textarea></label>`;
   case "select":return `<label class="f">${esc(f.l)}<select id="${id}" data-bind="${f.k}"><option value="">اختر</option>${f.o.map(x=>`<option ${v===x?"selected":""}>${esc(x)}</option>`).join("")}</select></label>`;
   case "seg":return `<div class="stack" style="gap:6px"><span class="fl">${esc(f.l)}</span><div class="seg">${f.o.map(x=>{const val=typeof x==="object"?x.v:x,l=typeof x==="object"?x.l:x;return `<button type="button" class="${v===val?"on":""}" data-act="seg" data-k="${f.k}" data-v="${esc(val)}" aria-pressed="${v===val}">${esc(l)}</button>`}).join("")}</div></div>`;
   case "checks":{const sel=Array.isArray(v)?v:[];return `<div class="stack" style="gap:6px">${f.l?`<span class="fl">${esc(f.l)}</span>`:""}${f.o.map((x,i)=>{const val=typeof x==="object"?x.v:x,l=typeof x==="object"?x.l:x;return `<label class="chk ${f.red?"red":""}"><input type="checkbox" id="${id}-${i}" data-act="chk" data-k="${f.k}" data-v="${esc(val)}" ${f.rerender?'data-rr="1"':""} ${sel.includes(val)?"checked":""}><span>${esc(l)}</span></label>`}).join("")}</div>`}
   case "list":{const arr=Array.isArray(v)?v:[];return `<div class="stack" style="gap:6px"><span class="fl">${esc(f.l)}</span>${f.ph.map((p,i)=>`<input type="text" id="${id}-${i}" data-bindlist="${f.k}" data-i="${i}" value="${esc(arr[i]||"")}" placeholder="${esc(p)}">`).join("")}</div>`}
   case "scale":{const arr=Array.isArray(v)?v:[];const opts=f.opts.concat(f.na?[{v:"na",l:"لا ينطبق",c:"#8A97A8"}]:[]);const done=arr.filter(x=>x!=null).length;
     return `<div class="sub">أجبت على ${done} من ${f.items.length}</div>`+f.items.map((q,i)=>`<div class="item ${arr[i]!=null?"done":""}"><div class="q"><span class="num">${(f.start||1)+i}</span> ${esc(q)}</div><div class="opts ${f.many?"many":""}" style="--n:${f.many?Math.min(opts.length,4):opts.length}">${opts.map(o=>`<button type="button" class="${arr[i]===o.v?"on":""}" style="--c:${o.c}" data-act="sc" data-k="${f.k}" data-i="${i}" data-v="${esc(o.v)}" data-n="${f.items.length}" aria-pressed="${arr[i]===o.v}">${esc(o.l)}</button>`).join("")}</div></div>`).join("")}
   case "behaviors":{const bs=r.behaviors||[];return bs.map((b,i)=>`<div class="beh"><div class="domh"><span>سلوك ${i+1}</span><button type="button" class="btn sm ghost" data-act="behDel" data-i="${i}">حذف</button></div>
     <label class="f">ماذا يفعل الطفل؟<input type="text" id="b-${i}-what" data-bind="behaviors.${i}.what" value="${esc(b.what||"")}" placeholder="مثال: يرمي الأدوات على الأرض"></label>
     <label class="f">متى يحدث؟ ماذا كان يجري قبله؟<textarea id="b-${i}-when" data-bind="behaviors.${i}.when">${esc(b.when||"")}</textarea></label>
     <label class="f">ماذا نفعل نحن بعده؟<textarea id="b-${i}-after" data-bind="behaviors.${i}.after">${esc(b.after||"")}</textarea></label>
     <div class="stack" style="gap:6px"><span class="fl">كم مرة؟</span><div class="seg">${FREQ.map(x=>`<button type="button" class="${b.freq===x?"on":""}" data-act="seg" data-k="behaviors.${i}.freq" data-v="${esc(x)}">${esc(x)}</button>`).join("")}</div></div>
     <label class="f">في رأيك، ماذا يريد الطفل من هذا السلوك؟<select id="b-${i}-want" data-bind="behaviors.${i}.want"><option value="">اختر</option>${WANT.map(w=>`<option ${b.want===w?"selected":""}>${esc(w)}</option>`).join("")}</select></label></div>`).join("")
     +(bs.length<2?`<button type="button" class="add" data-act="behAdd">+ إضافة سلوك</button>`:"")}
   case "goalstatus":{const gs=goalsOf(r.childId);if(!gs.length)return `<p class="sub" style="margin:0">لا أهداف مسجلة لهذا الطفل بعد. تُضاف من تبويب «المشروع الفردي» في ملفه.</p>`;
     return gs.map(g=>{const cur=(r.goalStatus||{})[g.id]||"";return `<div class="item"><div class="q">${esc(g.text)}</div><div class="seg">${GSTAT.map(s=>`<button type="button" class="${cur===s?"on":""} ${s==="تحقّق"?"g-done":""}" data-act="seg" data-k="goalStatus.${g.id}" data-v="${s}">${s}</button>`).join("")}</div><span class="sub">الحالة الحالية في الملف: ${esc(g.status||"لم يبدأ")}</span></div>`}).join("")}
  }
  return "";
}
function renderSheet(first){
  if(!F){closeSheet();return}
  const body=$("sheet").querySelector(".sh-body");const top=body&&!first?body.scrollTop:0;
  const r=F.r,isRec=F.col==="records";const c=isRec?childById(r.childId):null;
  let title=(F.kind==="child"?(F.isNew?"طفل جديد":"تعديل بطاقة الطفل"):F.kind==="act"?(F.isNew?"تسجيل نشاط":"تعديل النشاط"):F.spec.t)+(c?" — "+childLabel(c):"");
  let main,foot;
  if(F.mode==="view"){
    main=F.spec.html(r)+`<p class="sub">سجّله ${esc(whoR(r))}${r.updatedAt?" · آخر تعديل "+new Date(r.updatedAt).toLocaleDateString("ar-MA"):""}</p>`;
    foot=F.armed?`<button class="btn" data-act="sDisarm">إلغاء</button><button class="btn danger" data-act="sDel">تأكيد الحذف النهائي</button>`
      :`<button class="btn pri" data-act="copy">نسخ النص لإرساله</button>${downloads?`<button class="btn" data-act="dl">تنزيل كملف</button>`:""}<button class="btn" data-act="sEdit">تعديل</button><button class="btn ghost" data-act="sArm">حذف</button>`;
  }else{
    const secs=F.spec.sections(r);
    main=(isRec&&!r.childId?`<div class="fs"><label class="f">الطفل *<select id="f-child" data-bind="childId"><option value="">اختر الطفل</option>${[...S.children].sort((a,b)=>(a.code||"").localeCompare(b.code||"")).map(x=>`<option value="${esc(x.id)}">${esc(childLabel(x))}</option>`).join("")}</select></label></div>`:"")
      +secs.map(s=>`<section class="fs"><h3>${esc(s.t)}</h3>${s.lead?`<p class="lead">${esc(s.lead)}</p>`:""}${s.fields.map(fieldHtml).join("")}</section>`).join("");
    foot=`<button class="btn" data-act="close">إلغاء</button><button class="btn pri" data-act="save">${isRec?"حفظ وعرض النتيجة":"حفظ"}</button>`;
  }
  $("sheet").innerHTML=`<div class="sheetwrap" data-act="backdrop"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sh-top"><h2>${esc(title)}</h2><button class="btn sm ghost" data-act="close" aria-label="إغلاق">✕ إغلاق</button></div><div class="sh-body">${main}</div><div class="sh-foot">${foot}</div></div></div>`;
  document.body.style.overflow="hidden";
  $("sheet").querySelector(".sh-body").scrollTop=top;
}
async function saveSheet(){
  const r=F.r;
  if(F.col==="children"&&(!(r.code||"").trim()||!(r.name||"").trim())){toast("الرمز والاسم الأول إلزاميان.");return}
  if(F.col==="activities"&&!(r.title||"").trim()){toast("اكتب عنوان النشاط.");return}
  if(F.col==="records"&&!r.childId){toast("اختر الطفل أولًا.");return}
  if(F.col==="records"&&r.type==="acad"&&!(r.subjects||[]).length){toast("اختر مادة واحدة على الأقل.");return}
  if(F.col==="records"){if(!r.by)r.by=myId||null;if(!r.byName&&myName)r.byName=myName;r.updatedAt=Date.now()}
  try{await put(F.col,r)}catch(e){return}
  if(r.type==="obs"&&r.goalStatus)for(const [gid,st] of Object.entries(r.goalStatus)){const g=S.goals.find(x=>x.id===gid);if(g&&st&&g.status!==st){try{await put("goals",{...g,status:st})}catch(e){}}}
  toast("تم الحفظ");
  if(F.col==="records"){F.mode="view";F.isNew=false;renderSheet(true)}
  else{const k=F.kind,id=r.id;closeSheet();if(k==="child")location.hash="child-"+id}
}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);toast("تم النسخ. الصقه في واتساب أو في رسالة.")}
  catch(e){F={kind:"text",spec:{t:"النص",html:()=>""},col:null,r:{},mode:"text"};
    $("sheet").innerHTML=`<div class="sheetwrap"><div class="sheet"><div class="sh-top"><h2>انسخ النص يدويًا</h2><button class="btn sm ghost" data-act="close">✕ إغلاق</button></div><div class="sh-body"><textarea id="manualCopy" style="min-height:60vh">${esc(t)}</textarea></div></div></div>`;
    const ta=$("manualCopy");ta.focus();ta.select()}
}

/* ================= events ================= */
document.addEventListener("click",async e=>{
  const el=e.target.closest("[data-act]");if(!el)return;const a=el.dataset.act;
  if(a==="backdrop"&&e.target!==el)return;
  switch(a){
   case "go":location.hash=el.dataset.href.slice(1);break;
   case "tab":view.tab=el.dataset.v;render();break;
   case "arm":view.armed=el.dataset.v;render();break;
   case "disarm":view.armed=null;render();break;
   case "newChild":openForm("child");break;
   case "editChild":openForm("child",{r:childById(el.dataset.id)});break;
   case "delChild":{const id=el.dataset.id;view.armed=null;
     if(mode==="gas"){try{await api("apiDeleteChild",gasCode,id);await gasLoad()}catch(err){toast(apiErr(err));break}toast("تم حذف الملف");location.hash="children";render();break}
     for(const r of S.records.filter(x=>x.childId===id))await remove("records",r.id).catch(()=>{});
     for(const g of S.goals.filter(x=>x.childId===id))await remove("goals",g.id).catch(()=>{});
     await remove("children",id).catch(()=>{});toast("تم حذف الملف");location.hash="children";break}
   case "newRec":openForm(el.dataset.type,{child:el.dataset.child,spec:el.dataset.spec,reason:el.dataset.reason});break;
   case "quick":openForm("obs",{child:""});break;
   case "openRec":openRecord(el.dataset.id);break;
   case "newAct":openForm("act");break;
   case "editAct":openForm("act",{r:S.activities.find(x=>x.id===el.dataset.id)});break;
   case "delAct":view.armed=null;await remove("activities",el.dataset.id).catch(()=>{});break;
   case "gstat":{const g=S.goals.find(x=>x.id===el.dataset.id);if(g)await put("goals",{...g,status:el.dataset.v}).catch(()=>{});break}
   case "delGoal":view.armed=null;await remove("goals",el.dataset.id).catch(()=>{});break;
   case "sugg":$("g-text").value=el.dataset.t;$("g-dom").value=el.dataset.d;break;
   case "copyMeeting":copyText(meetingText());break;
   case "copyActs":copyText(actsText());break;
   case "logout":gasCode="";ls("afaq.code","");clearInterval(_poll);mode="login";render();break;
   /* sheet */
   case "backdrop":case "close":closeSheet();break;
   case "seg":{const cur=getP(F.r,el.dataset.k);setP(F.r,el.dataset.k,cur===el.dataset.v?"":el.dataset.v);renderSheet();break}
   case "sc":{let arr=getP(F.r,el.dataset.k);if(!Array.isArray(arr)){arr=Array(+el.dataset.n).fill(null);setP(F.r,el.dataset.k,arr)}
     while(arr.length<+el.dataset.n)arr.push(null);const i=+el.dataset.i;arr[i]=arr[i]===el.dataset.v?null:el.dataset.v;renderSheet();break}
   case "chk":{let arr=getP(F.r,el.dataset.k);if(!Array.isArray(arr)){arr=[];setP(F.r,el.dataset.k,arr)}const v=el.dataset.v;
     if(el.checked){if(!arr.includes(v))arr.push(v)}else setP(F.r,el.dataset.k,arr.filter(x=>x!==v));if(el.dataset.rr)renderSheet();break}
   case "behAdd":F.r.behaviors=F.r.behaviors||[];F.r.behaviors.push({what:"",when:"",after:"",freq:"",want:""});renderSheet();break;
   case "behDel":F.r.behaviors.splice(+el.dataset.i,1);renderSheet();break;
   case "save":saveSheet();break;
   case "sEdit":F.mode="edit";renderSheet(true);break;
   case "sArm":F.armed=true;renderSheet();break;
   case "sDisarm":F.armed=false;renderSheet();break;
   case "sDel":{const id=F.r.id;closeSheet();await remove("records",id).catch(()=>{});toast("تم الحذف");break}
   case "copy":copyText(F.spec.text(F.r));break;
   case "dl":{const r=F.r,c=childById(r.childId);try{await downloads.save({filename:(F.spec.t+"_"+(c?c.code:"")+"_"+r.date).replace(/[\\/:*?"<>|\s]+/g,"_")+".txt",data:F.spec.text(r)});toast("تم التنزيل")}catch(err){if(!err||err.code!=="declined")toast("تعذّر التنزيل. استعمل «نسخ النص».")}break}
  }
});
document.addEventListener("input",e=>{
  const el=e.target;
  if(F&&el.dataset.bind){setP(F.r,el.dataset.bind,el.type==="number"?(el.value===""?"":+el.value):el.value);if(el.dataset.bind==="childId"&&F.kind==="obs"){renderSheet()}return}
  if(F&&el.dataset.bindlist){let arr=getP(F.r,el.dataset.bindlist);if(!Array.isArray(arr)){arr=[];setP(F.r,el.dataset.bindlist,arr)}arr[+el.dataset.i]=el.value;return}
  if(el.id==="q"){view.q=el.value;const pos=el.selectionStart;render();const q=$("q");q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}}
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(F&&el.tagName==="SELECT"&&el.dataset.bind){setP(F.r,el.dataset.bind,el.value);if(el.dataset.bind==="childId")renderSheet()}
  if(el.id==="grp"){view.grp=el.value;render()}
  if(el.id==="month"&&el.value){view.month=el.value;render()}
});
document.addEventListener("submit",async e=>{
  if(e.target.id==="loginForm"){e.preventDefault();myName=$("l-name").value.trim();gasCode=$("l-code").value.trim();
    if(!myName||!gasCode)return;ls("afaq.name",myName);ls("afaq.code",gasCode);$("app").innerHTML=`<div class="loading">جار التحميل…</div>`;gasStart();return}
  if(e.target.id!=="goalForm")return;e.preventDefault();
  const id=route().id,text=$("g-text").value.trim();if(!text){toast("اكتب نص الهدف.");return}
  try{await put("goals",{id:uid(),childId:id,text,domain:$("g-dom").value,review:$("g-rev").value,who:$("g-who").value.trim(),status:"لم يبدأ",createdAt:Date.now()});toast("تمت إضافة الهدف")}catch(_){}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&F)closeSheet()});
boot();
</script>
